databases:
  - name: ingresso-db
    plan: free

services:
  - type: web
    name: ingresso-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/events/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ingresso-db
          property: connectionString
      - key: TMDB_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
